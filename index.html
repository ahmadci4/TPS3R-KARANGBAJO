        const { useState, useEffect, useRef } = React;

        function App() {
            // STATE APLIKASI
            const [view, setView] = useState('dashboard');
            const [user, setUser] = useState(null);
            const [customers, setCustomers] = useState([]);
            const [expenses, setExpenses] = useState([]); // Data Pengeluaran
            const [messages, setMessages] = useState([]);
            const [ratings, setRatings] = useState([]);
            const [isDbConnected, setIsDbConnected] = useState(false);
            
            // STATE MODE ADMIN
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [inputPin, setInputPin] = useState('');
            const [pinError, setPinError] = useState('');

            // STATE PROFIL & PENGATURAN
            const defaultProfile = {
                password: "krb1",
                tentang: "TPS3R Bangkit Bersih Adalah sebuah wadah yang mengorganisir dan mengelola sampah masyarakat desa Karang Bajo secara mandiri, dengan tujuan menciptakan lingkungan yang bersih dan bernilai ekonomis.",
                anggota: "1. Eri Sutisna\n2. Deden Asriandi\n3. Aedi",
                ketua: "Ketua TPS3R",
                kepalaDesa: "Kepala Desa Karang Bajo",
                kontak: "081234567890",
                alamatDesa: "Kantor Desa Karang Bajo, Kec. Bayan, Lombok Utara"
            };
            const [profile, setProfile] = useState(defaultProfile);
            const [showProfileEdit, setShowProfileEdit] = useState(false);
            const [editProfileData, setEditProfileData] = useState(defaultProfile);

            // STATE FORUM & RATING
            const [chatName, setChatName] = useState('');
            const [chatText, setChatText] = useState('');
            const [userRating, setUserRating] = useState(0);
            const messagesEndRef = useRef(null);

            // STATE LAPORAN, FORM & PENGELUARAN
            const defaultStart = new Date(); defaultStart.setDate(1);
            const [startDate, setStartDate] = useState(defaultStart.toISOString().split('T')[0]);
            const [endDate, setEndDate] = useState(new Date().toISOString().split('T')[0]);
            const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);
            
            const [isEditing, setIsEditing] = useState(false);
            const [editId, setEditId] = useState(null);
            const [showAddModal, setShowAddModal] = useState(false);
            const [newCustomer, setNewCustomer] = useState({ name: '', type: 'rumah_tangga', address: '', phone: '', rate: 15000 });
            const [searchTerm, setSearchTerm] = useState('');
            const [receiptData, setReceiptData] = useState(null);
            const receiptRef = useRef(null);
            
            // Modal Penarikan Dana
            const [showExpenseModal, setShowExpenseModal] = useState(false);
            const [newExpense, setNewExpense] = useState({ amount: '', reason: '' });

            // 1. INIT AUTH
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (error) { console.error("Login Error:", error); }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged((u) => setUser(u));
                return () => unsubscribe();
            }, []);

            // 2. FETCH SEMUA DATA DARI FIRESTORE
            useEffect(() => {
                if (!user) { setIsDbConnected(false); return; }
                
                // Fetch Customers
                const customersRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('customers');
                const unsubCustomers = customersRef.onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    data.sort((a, b) => b.id - a.id);
                    setCustomers(data);
                    setIsDbConnected(true); 
                }, (error) => { setIsDbConnected(false); });

                // Fetch Expenses
                const expensesRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('expenses');
                const unsubExpenses = expensesRef.onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    data.sort((a, b) => b.id - a.id);
                    setExpenses(data);
                });

                // Fetch Settings
                const settingsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('profile');
                const unsubSettings = settingsRef.onSnapshot((doc) => {
                    if (doc.exists) setProfile(doc.data());
                    else { settingsRef.set(defaultProfile); setProfile(defaultProfile); }
                });

                // Fetch Messages
                const msgRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('messages').orderBy('createdAt', 'asc');
                const unsubMsg = msgRef.onSnapshot(snap => {
                    setMessages(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });

                // Fetch Ratings
                const ratingRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('ratings');
                const unsubRating = ratingRef.onSnapshot(snap => {
                    const data = snap.docs.map(d => d.data());
                    setRatings(data);
                    const myRating = snap.docs.find(d => d.id === user.uid);
                    if(myRating) setUserRating(myRating.data().stars);
                });

                return () => { unsubCustomers(); unsubExpenses(); unsubSettings(); unsubMsg(); unsubRating(); };
            }, [user]);

            useEffect(() => {
                if (view === 'forum' && messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [messages, view]);

            // --- KALKULASI KEUANGAN & DASHBOARD ---
            const filteredCustomers = customers.filter(c => c.name.toLowerCase().includes(searchTerm.toLowerCase()) || c.address.toLowerCase().includes(searchTerm.toLowerCase()));
            const totalCustomers = customers.length;
            
            // Hitung Semua Pemasukan (Total Lunas)
            const totalIncomeCollected = customers.filter(c => c.status === 'lunas').reduce((acc, curr) => acc + curr.rate, 0);
            
            // Hitung Semua Pengeluaran
            const totalExpensesVal = expenses.reduce((acc, curr) => acc + curr.amount, 0);
            
            // Hitung Saldo Kas Saat Ini
            const currentBalance = totalIncomeCollected - totalExpensesVal;

            const percentCollected = totalCustomers > 0 ? Math.round((customers.filter(c => c.status === 'lunas').length / totalCustomers) * 100) : 0;
            const avgRating = ratings.length ? (ratings.reduce((a,c) => a+c.stars, 0) / ratings.length).toFixed(1) : 0;


            // --- FUNGSI FORUM & RATING ---
            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!chatText.trim()) return alert("Pesan tidak boleh kosong.");
                if (!user) return alert("Koneksi terputus.");
                const finalName = chatName.trim() ? chatName : "Warga Anonim";
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('messages').add({
                        text: chatText, senderName: finalName, createdAt: Date.now(), isAdmin: isAdmin, uid: user.uid
                    });
                    setChatText('');
                } catch (err) { alert("Gagal mengirim pesan."); }
            };

            const handleRate = async (stars) => {
                if (!user) return alert("Koneksi terputus.");
                setUserRating(stars);
                try { await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('ratings').doc(user.uid).set({ stars: stars, timestamp: Date.now() }); } 
                catch (err) { alert("Gagal mengirim rating."); }
            };

            // --- FUNGSI MODE ADMIN & PROFIL ---
            const handleToggleAdmin = () => {
                if (isAdmin) { 
                    setIsAdmin(false); 
                    if(view === 'rekap' || view === 'sync') setView('dashboard');
                } 
                else { setInputPin(''); setPinError(''); setShowAdminLogin(true); }
            };

            const submitAdminLogin = (e) => {
                e.preventDefault();
                if (inputPin === profile.password) { setIsAdmin(true); setShowAdminLogin(false); } 
                else { setPinError("Sandi salah!"); }
            };

            const saveProfileData = async (e) => {
                e.preventDefault();
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('profile').set(editProfileData, { merge: true });
                    setShowProfileEdit(false); alert("Profil & Sandi berhasil diperbarui!");
                } catch(err) { alert("Gagal menyimpan profil."); }
            };

            // --- FUNGSI CRUD WARGA & PENARIKAN DANA (HANYA ADMIN) ---
            const openAddModal = () => { if(!isAdmin) return; setIsEditing(false); setEditId(null); setNewCustomer({ name: '', type: 'rumah_tangga', address: '', phone: '', rate: 15000 }); setShowAddModal(true); };
            const handleEditCustomer = (customer) => { if(!isAdmin) return; setIsEditing(true); setEditId(customer.id); setNewCustomer({ name: customer.name, type: customer.type, address: customer.address, phone: customer.phone, rate: customer.rate }); setShowAddModal(true); };

            const handleSaveCustomer = async (e) => {
                e.preventDefault();
                if (!isDbConnected || !isAdmin) return;
                try {
                    const collectionRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('customers');
                    if (isEditing) { await collectionRef.doc(String(editId)).set({ ...newCustomer }, { merge: true }); } 
                    else { const newId = Date.now(); await collectionRef.doc(String(newId)).set({ ...newCustomer, id: newId, status: 'belum', paymentDate: null }); }
                    setShowAddModal(false);
                } catch (err) { alert("Gagal menyimpan data!"); }
            };

            const handleTypeChange = (e) => { const selectedType = e.target.value; const category = CATEGORIES.find(c => c.id === selectedType); setNewCustomer({ ...newCustomer, type: selectedType, rate: category ? category.rate : 0 }); };
            
            const togglePaymentStatus = async (id) => { 
                if (!isAdmin) return;
                const customer = customers.find(c => c.id === id); if (!customer) return;
                const newStatus = customer.status === 'lunas' ? 'belum' : 'lunas';
                const paymentDate = newStatus === 'lunas' ? Date.now() : null; 
                try { await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('customers').doc(String(id)).set({ status: newStatus, paymentDate }, { merge: true }); } 
                catch(err) { alert("Gagal memperbarui status!"); }
            };

            const handleDelete = async (id) => { 
                if(!isAdmin) return;
                if(confirm('Hapus pelanggan?')) {
                    try { await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('customers').doc(String(id)).delete(); } 
                    catch(err) { alert("Gagal menghapus data!"); }
                }
            };
            
            const handleSaveExpense = async (e) => {
                e.preventDefault();
                if (!isAdmin) return;
                const amount = Number(newExpense.amount);
                if (amount <= 0 || !newExpense.reason.trim()) return alert("Isi jumlah dan keterangan dengan benar!");
                if (amount > currentBalance) return alert("Penarikan gagal! Saldo kas tidak mencukupi.");
                
                try {
                    const newId = Date.now();
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('expenses').doc(String(newId)).set({
                        id: newId,
                        amount: amount,
                        reason: newExpense.reason,
                        timestamp: newId
                    });
                    setShowExpenseModal(false);
                    setNewExpense({ amount: '', reason: '' });
                    alert("Pengeluaran / Penarikan dana berhasil dicatat!");
                } catch (err) { alert("Gagal mencatat pengeluaran!"); }
            };

            // --- FUNGSI PRINT & EXPORT ---
            const downloadReceiptAsImage = async () => {
                if(!receiptRef.current) return;
                try {
                    const canvas = await html2canvas(receiptRef.current, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
                    const image = canvas.toDataURL("image/png");
                    const link = document.createElement("a");
                    link.href = image; link.download = `Struk_TPS3R_${receiptData.name.replace(/\s+/g, '_')}.png`; link.click();
                } catch (error) { alert("Gagal mengunduh gambar. Coba lagi."); }
            };

            const getFilteredDataByDate = () => {
                const start = new Date(startDate); start.setHours(0,0,0,0);
                const end = new Date(endDate); end.setHours(23,59,59,999);
                return customers.filter(c => { const itemDate = new Date(c.paymentDate || c.id); return itemDate >= start && itemDate <= end; });
            };
            
            const getFilteredExpensesByDate = () => {
                const start = new Date(startDate); start.setHours(0,0,0,0);
                const end = new Date(endDate); end.setHours(23,59,59,999);
                return expenses.filter(e => { const itemDate = new Date(e.timestamp); return itemDate >= start && itemDate <= end; });
            };

            // GENERATE PDF PROFESIONAL DENGAN KOP SURAT & PENGELUARAN
            const generateReportPDF = async () => {
                if(!isAdmin) return;
                setIsGeneratingPDF(true);
                
                try {
                    const dataToPrint = getFilteredDataByDate();
                    const expensesToPrint = getFilteredExpensesByDate();
                    const avgRatingCalc = ratings.length ? (ratings.reduce((a,c) => a+c.stars, 0) / ratings.length).toFixed(1) : 0;
                    
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

                    const logoKiri = await getBase64ImageFromUrl('logokrb.svg');
                    const logoKanan = await getBase64ImageFromUrl('tps3r.svg');

                    if (logoKiri) doc.addImage(logoKiri, 'PNG', 15, 12, 22, 25);
                    if (logoKanan) doc.addImage(logoKanan, 'PNG', 173, 12, 22, 22);

                    doc.setFont("helvetica", "bold"); doc.setFontSize(14);
                    doc.text("PEMERINTAH KABUPATEN LOMBOK UTARA", 105, 16, { align: "center" });
                    doc.text("KECAMATAN BAYAN", 105, 22, { align: "center" });
                    doc.setFontSize(16); doc.text("DESA KARANG BAJO", 105, 29, { align: "center" });
                    
                    doc.setFontSize(10); doc.setFont("helvetica", "normal");
                    doc.text(profile.alamatDesa || "Alamat: Kantor Desa Karang Bajo, Kec. Bayan, Lombok Utara", 105, 35, { align: "center" });
                    
                    doc.setLineWidth(1); doc.line(15, 40, 195, 40);
                    doc.setLineWidth(0.3); doc.line(15, 41.5, 195, 41.5);

                    doc.setFont("helvetica", "bold"); doc.setFontSize(12);
                    doc.text("LAPORAN KEUANGAN TPS3R BANGKIT BERSIH", 105, 52, { align: "center" });
                    doc.setFontSize(10); doc.setFont("helvetica", "normal");
                    doc.text(`Periode: ${formatIndoDate(startDate)} s/d ${formatIndoDate(endDate)}`, 105, 58, { align: "center" });

                    // SUMMARY KEUANGAN
                    const lunas = dataToPrint.filter(c => c.status === 'lunas');
                    const totalPemasukan = lunas.reduce((a, c) => a + c.rate, 0);
                    const totalPengeluaran = expensesToPrint.reduce((a, c) => a + c.amount, 0);
                    const saldoPeriode = totalPemasukan - totalPengeluaran;

                    doc.setFontSize(10);
                    doc.text(`Total Warga Lunas: ${lunas.length} Orang`, 15, 70);
                    doc.text(`Total Pemasukan Iuran: ${formatRupiah(totalPemasukan)}`, 15, 76);
                    doc.text(`Total Penarikan/Pengeluaran: ${formatRupiah(totalPengeluaran)}`, 15, 82);
                    doc.setFont("helvetica", "bold");
                    doc.text(`Saldo Kas Periode Ini: ${formatRupiah(saldoPeriode)}`, 15, 88);
                    
                    // TABEL PEMASUKAN
                    doc.setFont("helvetica", "bold");
                    doc.text("1. Rincian Pemasukan Iuran Warga", 15, 98);
                    const tableData = dataToPrint.map((c, i) => [ i + 1, c.name, c.address || '-', getCategoryLabel(c.type), c.status === 'lunas' ? 'LUNAS' : 'BELUM', formatRupiah(c.rate) ]);
                    
                    doc.autoTable({
                        startY: 102,
                        head: [['No', 'Nama', 'Alamat', 'Kategori', 'Status', 'Jumlah']],
                        body: tableData,
                        theme: 'grid',
                        headStyles: { fillColor: [40, 40, 40] },
                        styles: { fontSize: 8, cellPadding: 3 },
                        columnStyles: { 0: { cellWidth: 10 }, 4: { fontStyle: 'bold' }, 5: { halign: 'right' } }
                    });

                    let finalY = doc.lastAutoTable.finalY + 12;

                    // TABEL PENGELUARAN (JIKA ADA)
                    if (expensesToPrint.length > 0) {
                        if (finalY > 230) { doc.addPage(); finalY = 20; }
                        doc.setFont("helvetica", "bold");
                        doc.text("2. Rincian Pengeluaran / Penarikan Dana", 15, finalY);
                        
                        const expTableData = expensesToPrint.map((e, i) => [
                            i + 1, formatIndoDate(e.timestamp), e.reason, formatRupiah(e.amount)
                        ]);

                        doc.autoTable({
                            startY: finalY + 4,
                            head: [['No', 'Tanggal', 'Keterangan / Keperluan', 'Jumlah (Rp)']],
                            body: expTableData,
                            theme: 'grid',
                            headStyles: { fillColor: [185, 28, 28] }, // Warna Merah untuk Pengeluaran
                            styles: { fontSize: 8, cellPadding: 3 },
                            columnStyles: { 0: { cellWidth: 10 }, 3: { halign: 'right', fontStyle: 'bold' } }
                        });
                        finalY = doc.lastAutoTable.finalY + 12;
                    }

                    // RATING & KOMENTAR
                    if (finalY > 230) { doc.addPage(); finalY = 20; }
                    doc.setFont("helvetica", "bold");
                    doc.text(`Tingkat Kepuasan Masyarakat: ${avgRatingCalc} / 5.0 Bintang (${ratings.length} Ulasan)`, 15, finalY);
                    finalY += 8;
                    doc.text("Sorotan Saran & Masukan Warga:", 15, finalY);
                    finalY += 4;

                    const recentComments = messages.slice(-5).map(m => [m.senderName, m.text]);
                    if(recentComments.length > 0) {
                        doc.autoTable({ startY: finalY, head: [['Nama Pengirim', 'Komentar / Saran']], body: recentComments, theme: 'grid', headStyles: { fillColor: [230, 230, 230], textColor: [0, 0, 0] }, styles: { fontSize: 8, cellPadding: 3 }, columnStyles: { 0: { cellWidth: 40, fontStyle: 'bold' } } });
                        finalY = doc.lastAutoTable.finalY + 15;
                    } else {
                        doc.setFont("helvetica", "italic"); doc.text("Belum ada saran/komentar dari warga.", 15, finalY); finalY += 15;
                    }

                    // TANDA TANGAN
                    if (finalY > 240) { doc.addPage(); finalY = 30; } 
                    doc.setFontSize(10); doc.setFont("helvetica", "normal");
                    doc.text("Mengetahui,", 25, finalY); doc.text("Ketua TPS3R", 25, finalY + 6);
                    doc.setFont("helvetica", "bold"); doc.text(profile.ketua || "Ketua TPS3R", 25, finalY + 30);
                    
                    doc.setFont("helvetica", "normal"); doc.text(`Desa Karang Bajo, ${formatIndoDate(new Date())}`, 125, finalY); doc.text("Kepala Desa Karang Bajo", 125, finalY + 6);
                    doc.setFont("helvetica", "bold"); doc.text(profile.kepalaDesa || "Kepala Desa", 125, finalY + 30);

                    doc.save(`Laporan_Keuangan_TPS3R_${startDate}.pdf`);
                } catch (err) { alert("Terjadi kesalahan saat membuat PDF."); } 
                finally { setIsGeneratingPDF(false); }
            };

            const generateReportExcel = (dataList = null, isBackup = false) => {
                if(!isAdmin) return;
                const dataToExport = dataList || getFilteredDataByDate();
                const expensesToExport = isBackup ? expenses : getFilteredExpensesByDate();

                const formattedInc = dataToExport.map(c => ({ ID: c.id, Nama: c.name, Alamat: c.address, Kategori: c.type, NoHP: c.phone || '-', Tarif: c.rate, Status: c.status, TanggalBayar: c.paymentDate ? new Date(c.paymentDate).toISOString() : '-' }));
                const formattedExp = expensesToExport.map(e => ({ ID: e.id, Tanggal: new Date(e.timestamp).toISOString(), Keterangan: e.reason, JumlahKeluar: e.amount }));

                const wb = XLSX.utils.book_new();
                
                // Sheet Pemasukan
                const wsInc = XLSX.utils.json_to_sheet(formattedInc); 
                XLSX.utils.book_append_sheet(wb, wsInc, "Pemasukan_Iuran");
                
                // Sheet Pengeluaran
                if (formattedExp.length > 0) {
                    const wsExp = XLSX.utils.json_to_sheet(formattedExp);
                    XLSX.utils.book_append_sheet(wb, wsExp, "Pengeluaran_Dana");
                }

                XLSX.writeFile(wb, isBackup ? `Backup_Keuangan_TPS3R.xlsx` : `Laporan_Keuangan_TPS3R_${startDate}_to_${endDate}.xlsx`);
            };

            // NOTE: Import Excel difokuskan untuk Pemulihan Warga (Pemasukan)
            const handleImportExcel = (e) => {
                if (!isAdmin) return;
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const bstr = evt.target.result; const wb = XLSX.read(bstr, { type: 'binary' }); 
                        const wsname = wb.SheetNames[0]; // Ambil sheet pertama saja (Data Warga)
                        const ws = wb.Sheets[wsname]; const data = XLSX.utils.sheet_to_json(ws);
                        if(data.length === 0) return alert("File kosong!"); if(!confirm(`Ditemukan ${data.length} data warga. Lanjutkan pemulihan data?`)) return;

                        const batch = db.batch(); const collectionRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('customers');
                        let count = 0;
                        data.forEach(row => {
                            if(row.Nama && row.Kategori) {
                                const docId = row.ID ? String(row.ID) : String(Date.now() + count);
                                batch.set(collectionRef.doc(docId), { id: Number(docId), name: String(row.Nama), type: String(row.Kategori), address: String(row.Alamat || ''), phone: String(row.NoHP === '-' ? '' : row.NoHP), rate: Number(row.Tarif || 15000), status: String(row.Status || 'belum'), paymentDate: row.TanggalBayar && row.TanggalBayar !== '-' ? new Date(row.TanggalBayar).getTime() : null }, { merge: true }); count++;
                            }
                        });
                        await batch.commit(); alert(`Berhasil mengimpor ${count} data warga!`); e.target.value = ''; 
                    } catch (error) { alert("Gagal membaca file Excel."); }
                };
                reader.readAsBinaryString(file);
            };

            const NavItem = ({ icon: Icon, label, tabId }) => (
                <button 
                    onClick={() => setView(tabId)} 
                    className={`flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2 p-2 md:px-4 md:py-2.5 rounded-xl md:rounded-full transition-all duration-300 min-w-[65px] md:w-auto
                    ${view === tabId ? 'text-indigo-600 bg-indigo-50 md:bg-white/20 md:text-white font-bold' : 'text-slate-400 hover:text-indigo-500 md:text-white/70 md:hover:bg-white/10 md:hover:text-white'}`}
                >
                    <Icon /> <span className="text-[10px] md:text-sm whitespace-nowrap">{label}</span>
                </button>
            );

            return (
                <div className="min-h-screen pb-mobile-nav md:pb-0 flex flex-col font-sans relative">
                    
                    {/* HEADER UTAMA */}
                    <header className="gradient-bg shadow-md text-white sticky top-0 z-30">
                        <div className="max-w-6xl mx-auto px-4 md:px-8 flex justify-between items-center h-16 md:h-20">
                            <div className="flex items-center gap-3">
                                <img src="tps3r.svg" alt="Logo TPS3R" className="w-10 h-10 object-contain bg-white/20 p-1 rounded-xl backdrop-blur-sm" onError={(e) => { e.target.style.display = 'none'; }} />
                                <div>
                                    <h1 className="font-bold text-lg md:text-xl leading-tight tracking-wide">TPS3R Bangkit Bersih</h1>
                                    <p className="text-[10px] text-indigo-100 hidden md:block">Desa Karang Bajo</p>
                                </div>
                            </div>
                            <nav className="hidden md:flex gap-1 lg:gap-2">
                                <NavItem icon={Icons.Dashboard} label="Dashboard" tabId="dashboard" />
                                <NavItem icon={Icons.Users} label="Data Warga" tabId="customers" />
                                <NavItem icon={Icons.MessageCircle} label="Diskusi" tabId="forum" />
                                {isAdmin && <NavItem icon={Icons.FileText} label="Laporan" tabId="rekap" />}
                                <NavItem icon={Icons.Info} label="Tentang" tabId="about" />
                                {isAdmin && <NavItem icon={Icons.Settings} label="Sync" tabId="sync" />}
                            </nav>
                            <div className="flex items-center gap-3">
                                <div className="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-xl border border-white/20 shadow-sm cursor-pointer" onClick={handleToggleAdmin} title="Klik saklar ini untuk Mode Admin">
                                    <span className="text-[10px] sm:text-xs font-bold hidden sm:inline">{isAdmin ? 'Admin ON' : 'Mode Admin'}</span>
                                    <div className="relative inline-block w-8 sm:w-10 mr-1 sm:mr-2 align-middle select-none transition duration-200 ease-in pointer-events-none">
                                        <input type="checkbox" checked={isAdmin} readOnly className="toggle-checkbox absolute block w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-white border-4 appearance-none z-10 top-0.5 left-0.5 transition-all duration-300"/>
                                        <label className="toggle-label block overflow-hidden h-5 sm:h-6 rounded-full bg-indigo-900/50"></label>
                                    </div>
                                    {isAdmin ? <Icons.Unlock /> : <Icons.Lock />}
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-6xl mx-auto p-4 md:p-8">
                        
                        {/* VIEW 1: DASHBOARD */}
                        {view === 'dashboard' && (
                            <div className="space-y-6 animate-fade-in-up">
                                <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h2 className="text-2xl font-extrabold text-slate-800">Halo, {isAdmin ? 'Admin!' : 'Warga Karang Bajo'} 👋</h2>
                                        <p className="text-slate-500 text-sm mt-1">Pantau transparansi iuran sampah bulan ini.</p>
                                    </div>
                                    {isAdmin && (
                                        <button onClick={() => setView('customers')} className="gradient-bg text-white px-6 py-3 rounded-full font-bold shadow-lg shadow-indigo-200 hover:shadow-xl transition flex items-center gap-2">
                                            <Icons.Plus /> Tambah Tagihan
                                        </button>
                                    )}
                                </div>

                                <div className={`grid grid-cols-1 md:grid-cols-2 ${isAdmin ? 'xl:grid-cols-4' : 'lg:grid-cols-3'} gap-4`}>
                                    {/* SENSITIF: Hanya Admin yang bisa melihat Saldo dan Pengeluaran */}
                                    {isAdmin && (
                                        <div className="bg-indigo-600 text-white p-6 rounded-3xl shadow-sm relative overflow-hidden group col-span-1 md:col-span-2 xl:col-span-1 flex flex-col justify-between min-h-[160px]">
                                            <div>
                                                <p className="text-indigo-200 text-xs font-bold uppercase tracking-widest">Saldo Kas Saat Ini</p>
                                                <h3 className="text-3xl font-black mt-2">{formatRupiah(currentBalance)}</h3>
                                                <div className="mt-3 text-[10px] text-indigo-100 flex justify-between bg-indigo-900/30 p-2 rounded-lg">
                                                    <span>In: {formatRupiah(totalIncomeCollected)}</span>
                                                    <span>Out: {formatRupiah(totalExpensesVal)}</span>
                                                </div>
                                            </div>
                                            <button onClick={() => setShowExpenseModal(true)} className="mt-4 bg-white text-indigo-600 hover:bg-indigo-50 py-2.5 rounded-xl text-xs font-bold transition flex justify-center items-center gap-2 shadow-md z-10 relative">
                                                <Icons.Wallet /> Tarik Dana / Pengeluaran
                                            </button>
                                            <div className="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-bl-full -z-10 transition-transform group-hover:scale-110"></div>
                                        </div>
                                    )}
                                    
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 relative overflow-hidden group flex flex-col justify-center min-h-[160px]">
                                        <p className="text-slate-400 text-xs font-bold uppercase tracking-widest">Total Warga</p>
                                        <h3 className="text-3xl font-black text-slate-800 mt-2">{totalCustomers} <span className="text-sm font-medium text-slate-400">Terdaftar</span></h3>
                                        <div className="absolute top-0 right-0 w-24 h-24 bg-sky-50 rounded-bl-full -z-10 transition-transform group-hover:scale-110"></div>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 relative overflow-hidden group flex flex-col justify-center min-h-[160px]">
                                        <p className="text-slate-400 text-xs font-bold uppercase tracking-widest">Kepatuhan Warga</p>
                                        <h3 className="text-3xl font-black text-emerald-500 mt-2">{percentCollected}% <span className="text-sm font-medium text-slate-400">Lunas</span></h3>
                                        <div className="w-full bg-slate-100 rounded-full h-2 mt-3"><div className="bg-emerald-400 h-2 rounded-full transition-all duration-1000" style={{ width: `${percentCollected}%` }}></div></div>
                                        <div className="absolute top-0 right-0 w-24 h-24 bg-emerald-50 rounded-bl-full -z-10 transition-transform group-hover:scale-110"></div>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 relative overflow-hidden group flex flex-col justify-center min-h-[160px]">
                                        <p className="text-slate-400 text-xs font-bold uppercase tracking-widest">Rating Pelayanan</p>
                                        <div className="flex items-center gap-2 mt-2">
                                            <h3 className="text-3xl font-black text-amber-500">{avgRating}</h3>
                                            <Icons.Star filled={true} />
                                        </div>
                                        <p className="text-[10px] text-slate-400 mt-1">Berdasarkan {ratings.length} ulasan warga.</p>
                                        <div className="absolute top-0 right-0 w-24 h-24 bg-amber-50 rounded-bl-full -z-10 transition-transform group-hover:scale-110"></div>
                                    </div>
                                </div>

                                {/* EDUKASI WARGA (Akses Umum) */}
                                <div className="mt-8 bg-slate-800 rounded-3xl p-6 md:p-8 text-white relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-indigo-500/20 rounded-full blur-3xl -z-10"></div>
                                    <h2 className="text-xl md:text-2xl font-bold mb-2">Kenapa Mempercayakan Sampah ke TPS3R? 🌱</h2>
                                    <p className="text-slate-300 text-sm mb-6">Bersama kita wujudkan Karang Bajo yang asri dan sehat. Ini 3 alasan utama mengapa partisipasi Anda sangat penting:</p>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="bg-slate-700/50 p-5 rounded-2xl border border-slate-600/50">
                                            <div className="text-emerald-400 mb-3"><Icons.CheckCircle /></div>
                                            <h3 className="font-bold mb-2">Lingkungan Bersih & Sehat</h3>
                                            <p className="text-xs text-slate-300 leading-relaxed">Mencegah penumpukan sampah liar yang menjadi sumber penyakit dan bau tidak sedap di sekitar rumah kita.</p>
                                        </div>
                                        <div className="bg-slate-700/50 p-5 rounded-2xl border border-slate-600/50">
                                            <div className="text-sky-400 mb-3"><Icons.TrendingUp /></div>
                                            <h3 className="font-bold mb-2">Bernilai Ekonomis</h3>
                                            <p className="text-xs text-slate-300 leading-relaxed">Sampah yang dipilah dapat didaur ulang dan diolah menjadi kompos, memberikan nilai tambah ekonomi bagi kas desa.</p>
                                        </div>
                                        <div className="bg-slate-700/50 p-5 rounded-2xl border border-slate-600/50">
                                            <div className="text-indigo-400 mb-3"><Icons.Shield /></div>
                                            <h3 className="font-bold mb-2">Dikelola Mandiri oleh Desa</h3>
                                            <p className="text-xs text-slate-300 leading-relaxed">Dikelola oleh warga, untuk warga. Membuka lapangan pekerjaan lokal dan memastikan transparansi pengelolaan.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW 2: DATA WARGA */}
                        {view === 'customers' && (
                            <div className="space-y-4 animate-fade-in-up">
                                <div className="flex flex-col sm:flex-row justify-between gap-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 sticky top-16 md:top-0 z-20">
                                    <div className="relative w-full sm:w-96">
                                        <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Search /></div>
                                        <input type="text" placeholder="Cari nama atau alamat..." className="w-full pl-11 pr-4 py-2.5 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 text-sm outline-none" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                                    </div>
                                    {isAdmin && (
                                        <button onClick={openAddModal} className="gradient-bg text-white px-5 py-2.5 rounded-xl font-bold shadow-md hover:opacity-90 transition flex justify-center items-center gap-2">
                                            <Icons.Plus /> Warga Baru
                                        </button>
                                    )}
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-x-auto hide-scrollbar">
                                    <table className="w-full text-sm text-left whitespace-nowrap md:whitespace-normal">
                                        <thead className="bg-slate-50/50 border-b border-slate-100 text-slate-500 uppercase text-[10px] font-bold tracking-widest">
                                            <tr>
                                                <th className="px-5 py-4">Data Warga</th>
                                                <th className="px-5 py-4">Tarif & Kategori</th>
                                                <th className="px-5 py-4 text-center">Status Bayar</th>
                                                <th className="px-5 py-4 text-right">Struk / Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {filteredCustomers.length === 0 ? <tr><td colSpan="4" className="text-center py-10 text-slate-400">Data tidak ditemukan</td></tr> : 
                                            filteredCustomers.map(customer => (
                                                <tr key={customer.id} className="hover:bg-indigo-50/30 transition">
                                                    <td className="px-5 py-4">
                                                        <div className="font-bold text-slate-800 text-base">{customer.name}</div>
                                                        <div className="text-xs text-slate-500 mt-0.5">{customer.address}</div>
                                                    </td>
                                                    <td className="px-5 py-4">
                                                        <div className="font-bold text-indigo-600">{formatRupiah(customer.rate)}</div>
                                                        <div className="text-[10px] px-2 py-0.5 rounded-md bg-slate-100 inline-block mt-1 font-semibold text-slate-500">{getCategoryLabel(customer.type)}</div>
                                                    </td>
                                                    <td className="px-5 py-4 text-center">
                                                        <button 
                                                            onClick={() => togglePaymentStatus(customer.id)} 
                                                            disabled={!isAdmin}
                                                            className={`px-4 py-2 rounded-xl text-[10px] font-bold border uppercase tracking-wider transition w-24 ${!isAdmin ? 'cursor-default' : 'hover:scale-105'} ${customer.status === 'lunas' ? 'bg-emerald-50 text-emerald-600 border-emerald-200 shadow-sm' : 'bg-white text-slate-400 border-slate-200'}`}
                                                        >
                                                            {customer.status === 'lunas' ? 'LUNAS ✔' : 'BELUM'}
                                                        </button>
                                                        {customer.paymentDate && <div className="text-[9px] text-slate-400 mt-1">{formatIndoDate(customer.paymentDate)}</div>}
                                                    </td>
                                                    <td className="px-5 py-4 text-right">
                                                        <div className="flex justify-end gap-1.5">
                                                            <button onClick={() => customer.status === 'lunas' ? setReceiptData(customer) : null} className={`p-2 rounded-lg transition flex items-center gap-1 ${customer.status === 'lunas' ? 'bg-indigo-50 text-indigo-600 hover:bg-indigo-100' : 'bg-slate-50 text-slate-300 cursor-not-allowed'}`} title="Buka Struk">
                                                                <Icons.FileText /> <span className="text-xs font-bold hidden md:inline">Struk</span>
                                                            </button>
                                                            {isAdmin && (
                                                                <>
                                                                    <button onClick={() => handleEditCustomer(customer)} className="p-2 text-slate-400 hover:text-amber-500 hover:bg-amber-50 rounded-lg transition"><Icons.Edit /></button>
                                                                    <button onClick={() => handleDelete(customer.id)} className="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition"><Icons.Trash2 /></button>
                                                                </>
                                                            )}
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* VIEW 3: RUANG DISKUSI WARGA & RATING */}
                        {view === 'forum' && (
                            <div className="space-y-4 animate-fade-in-up max-w-4xl mx-auto h-[calc(100vh-140px)] flex flex-col">
                                
                                {/* Info Admin & Hubungi Cepat */}
                                <div className="bg-indigo-50 border border-indigo-100 p-4 rounded-3xl flex flex-col md:flex-row justify-between items-center gap-3 shrink-0 shadow-sm">
                                    <div className="text-sm text-indigo-800 text-center md:text-left">
                                        <span className="font-bold block md:inline">Butuh Bantuan Cepat atau Keluhan Privasi?</span> Hubungi langsung Ketua TPS3R:
                                    </div>
                                    <a href={`https://wa.me/${profile.kontak.replace(/^0/, '62')}`} target="_blank" className="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-indigo-700 transition flex items-center gap-2 shadow-md">
                                        📞 Chat WhatsApp ({profile.kontak})
                                    </a>
                                </div>

                                {/* Header Forum & Rating Bintang */}
                                <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4 shrink-0">
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2"><Icons.MessageCircle /> Ruang Diskusi Umum</h2>
                                        <p className="text-xs text-slate-500">Bebas berkomentar menggunakan nama samaran.</p>
                                    </div>
                                    <div className="bg-amber-50 p-3 rounded-2xl flex items-center gap-3 w-full md:w-auto justify-center">
                                        <span className="text-xs font-bold text-amber-700">Tingkat Kepuasan:</span>
                                        <div className="flex gap-1">
                                            {[1,2,3,4,5].map(star => (
                                                <button key={star} onClick={() => handleRate(star)} className="focus:outline-none hover:scale-110 transition">
                                                    <Icons.Star filled={star <= userRating} />
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Chat Area */}
                                <div className="bg-white rounded-3xl shadow-sm border border-slate-100 flex-1 flex flex-col overflow-hidden">
                                    <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 chat-container bg-slate-50/50">
                                        {messages.length === 0 ? (
                                            <div className="h-full flex flex-col items-center justify-center text-slate-400 text-sm">
                                                <Icons.MessageCircle /> <p className="mt-2">Belum ada diskusi. Jadilah yang pertama!</p>
                                            </div>
                                        ) : (
                                            messages.map((msg, i) => (
                                                <div key={msg.id || i} className={`flex ${msg.uid === (user?.uid) ? 'justify-end' : 'justify-start'}`}>
                                                    <div className={`p-3 md:p-4 rounded-2xl max-w-[85%] md:max-w-[70%] shadow-sm ${msg.isAdmin ? 'bg-indigo-50 border border-indigo-100 rounded-tl-none' : msg.uid === (user?.uid) ? 'bg-emerald-50 border border-emerald-100 rounded-tr-none' : 'bg-white border border-slate-100 rounded-tl-none'}`}>
                                                        <div className="flex items-center gap-2 mb-2 border-b border-black/5 pb-1">
                                                            <span className="font-bold text-xs text-slate-800">{msg.senderName}</span>
                                                            {msg.isAdmin && <span className="bg-indigo-500 text-white text-[9px] px-2 py-0.5 rounded-full font-bold">Admin</span>}
                                                        </div>
                                                        <p className="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed">{msg.text}</p>
                                                        <span className="text-[10px] text-slate-400 mt-2 block text-right">{formatIndoDateTime(msg.createdAt)}</span>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                        <div ref={messagesEndRef} />
                                    </div>

                                    {/* Input Chat (No Phone Needed, Optional Name) */}
                                    <div className="bg-white p-4 border-t border-slate-100 shrink-0">
                                        <form onSubmit={handleSendMessage} className="space-y-3">
                                            <input type="text" placeholder="Nama Anda (Boleh Samaran / Kosongkan)..." value={chatName} onChange={e=>setChatName(e.target.value)} className="w-full md:w-1/3 border border-slate-200 p-2.5 rounded-xl bg-slate-50 outline-none text-sm focus:border-indigo-400 focus:bg-white transition" />
                                            <div className="flex gap-2">
                                                <textarea placeholder="Ketik saran, keluhan, atau pesan Anda di sini..." required value={chatText} onChange={e=>setChatText(e.target.value)} className="flex-1 border border-slate-200 p-3 rounded-xl bg-slate-50 outline-none text-sm resize-none h-12 focus:border-indigo-400 focus:bg-white transition" onKeyDown={(e) => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSendMessage(e); } }} />
                                                <button type="submit" className="bg-indigo-600 text-white p-3 rounded-xl hover:bg-indigo-700 transition flex items-center justify-center shrink-0 w-12 h-12 shadow-md">
                                                    <Icons.Send />
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW 4: LAPORAN (HANYA ADMIN) */}
                        {view === 'rekap' && isAdmin && (
                            <div className="space-y-6 animate-fade-in-up max-w-4xl mx-auto">
                                <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-100">
                                    <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2"><Icons.FileText /> Laporan Keuangan Resmi</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-slate-50 p-4 rounded-2xl">
                                        <div><label className="text-xs font-bold text-slate-500 block mb-2">Dari Tanggal</label><input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="w-full border-none p-3 rounded-xl bg-white shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-medium" /></div>
                                        <div><label className="text-xs font-bold text-slate-500 block mb-2">Sampai Tanggal</label><input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="w-full border-none p-3 rounded-xl bg-white shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-medium" /></div>
                                    </div>
                                    <div className="flex flex-col sm:flex-row gap-3">
                                        <button onClick={generateReportPDF} disabled={isGeneratingPDF} className={`flex-1 text-white py-3.5 rounded-xl font-bold transition shadow-md flex justify-center items-center gap-2 ${isGeneratingPDF ? 'bg-red-400 cursor-wait' : 'bg-red-500 hover:bg-red-600'}`}>
                                            <Icons.FileDown /> {isGeneratingPDF ? 'Memproses PDF...' : 'Download Laporan (PDF)'}
                                        </button>
                                        <button onClick={() => generateReportExcel()} className="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-3.5 rounded-xl font-bold transition shadow-md flex justify-center items-center gap-2">
                                            <Icons.FileDown /> Download Data (Excel)
                                        </button>
                                    </div>
                                    <p className="text-xs text-center mt-4 text-slate-400">PDF otomatis memuat Kop Surat Resmi, Rincian Pengeluaran, Rating Warga, dan Saldo.</p>
                                </div>
                            </div>
                        )}

                        {/* VIEW 5: TENTANG & ANGGOTA */}
                        {view === 'about' && (
                            <div className="space-y-6 animate-fade-in-up max-w-4xl mx-auto">
                                <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-100 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-50 rounded-bl-full -z-10"></div>
                                    
                                    <div className="flex justify-between items-start mb-6">
                                        <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2"><Icons.Info /> Profil TPS3R</h2>
                                        {isAdmin && (
                                            <button onClick={() => { setEditProfileData(profile); setShowProfileEdit(true); }} className="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl text-sm font-bold hover:bg-indigo-200 transition flex gap-2 items-center">
                                                <Icons.Edit /> Edit Profil
                                            </button>
                                        )}
                                    </div>

                                    <div className="space-y-6 text-slate-600 leading-relaxed text-sm md:text-base">
                                        <div className="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                                            <h3 className="font-bold text-slate-800 mb-2">Tentang Kami</h3>
                                            <p className="whitespace-pre-line">{profile.tentang}</p>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div className="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                                                <h3 className="font-bold text-slate-800 mb-2">Struktur Organisasi</h3>
                                                <p className="mb-1"><span className="font-semibold">Kepala Desa:</span> {profile.kepalaDesa}</p>
                                                <p className="mb-4"><span className="font-semibold">Ketua TPS3R:</span> {profile.ketua}</p>
                                                <h4 className="font-bold text-slate-700 mb-1">Daftar Anggota:</h4>
                                                <p className="whitespace-pre-line text-sm">{profile.anggota}</p>
                                            </div>
                                            
                                            <div className="bg-slate-50 p-5 rounded-2xl border border-slate-100 flex flex-col justify-between">
                                                <div>
                                                    <h3 className="font-bold text-slate-800 mb-2">Informasi Kontak</h3>
                                                    <p className="mb-2 text-sm">Untuk informasi lebih lanjut mengenai layanan pengelolaan sampah ini, Anda dapat menghubungi atau datang langsung ke kantor kami.</p>
                                                    <p className="mb-1 text-sm"><span className="font-semibold">📞 Telepon/WA:</span> {profile.kontak}</p>
                                                    <p className="text-sm"><span className="font-semibold">📍 Alamat:</span> {profile.alamatDesa}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW 6: SINKRONISASI (HANYA ADMIN) */}
                        {view === 'sync' && isAdmin && (
                            <div className="space-y-6 animate-fade-in-up max-w-4xl mx-auto">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 text-center">
                                        <div className="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-500 mx-auto mb-4"><Icons.DownloadCloud /></div>
                                        <h3 className="text-lg font-bold text-slate-800 mb-2">Backup Data</h3>
                                        <p className="text-xs text-slate-500 mb-6">Unduh seluruh data (Pemasukan & Pengeluaran) ke format Excel.</p>
                                        <button onClick={() => generateReportExcel(null, true)} className="w-full bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-xl font-bold transition">Unduh Semua Data</button>
                                    </div>
                                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 text-center">
                                        <div className="w-16 h-16 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-500 mx-auto mb-4"><Icons.UploadCloud /></div>
                                        <h3 className="text-lg font-bold text-slate-800 mb-2">Pulihkan Data (Warga)</h3>
                                        <p className="text-xs text-slate-500 mb-6">Unggah file Excel hasil Backup khusus untuk memulihkan data Pemasukan Warga.</p>
                                        <label className="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-xl font-bold transition flex justify-center items-center cursor-pointer">
                                            Pilih File Excel <input type="file" accept=".xlsx, .xls" className="hidden" onChange={handleImportExcel} />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MOBILE NAV */}
                    <nav className="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-slate-100 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-40 pb-safe overflow-x-auto hide-scrollbar">
                        <div className="flex justify-start items-center p-2 gap-2 min-w-max px-4">
                            <NavItem icon={Icons.Dashboard} label="Home" tabId="dashboard" />
                            <NavItem icon={Icons.Users} label="Warga" tabId="customers" />
                            <NavItem icon={Icons.MessageCircle} label="Diskusi" tabId="forum" />
                            {isAdmin && <NavItem icon={Icons.FileText} label="Laporan" tabId="rekap" />}
                            <NavItem icon={Icons.Info} label="Tentang" tabId="about" />
                            {isAdmin && <NavItem icon={Icons.Settings} label="Sync" tabId="sync" />}
                        </div>
                    </nav>

                    {/* MODAL: LOGIN ADMIN (PIN) */}
                    {showAdminLogin && (
                        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setShowAdminLogin(false)}>
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl animate-fade-in-up" onClick={e => e.stopPropagation()}>
                                <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4"><Icons.Lock /></div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2 text-center">Akses Admin</h3>
                                <p className="text-xs text-slate-500 text-center mb-6">Masukkan sandi khusus untuk mengedit dan melihat laporan.</p>
                                <form onSubmit={submitAdminLogin} className="space-y-4">
                                    <input autoFocus type="password" value={inputPin} onChange={(e) => setInputPin(e.target.value)} className="w-full border-2 border-slate-200 p-3 rounded-xl bg-slate-50 focus:border-indigo-500 outline-none text-center font-bold tracking-[0.3em]" placeholder="••••" />
                                    {pinError && <p className="text-red-500 text-xs text-center font-bold">{pinError}</p>}
                                    <button type="submit" className="w-full gradient-bg text-white py-3 rounded-xl font-bold shadow-lg">Buka Akses</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: EDIT PROFIL & SANDI */}
                    {showProfileEdit && isAdmin && (
                        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm overflow-y-auto py-10" onClick={() => setShowProfileEdit(false)}>
                            <div className="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl animate-fade-in-up my-auto" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-bold text-slate-800 mb-6 border-b pb-3 flex items-center gap-2"><Icons.Edit /> Edit Profil & Keamanan</h3>
                                <form onSubmit={saveProfileData} className="space-y-4 max-h-[70vh] overflow-y-auto pr-2 hide-scrollbar">
                                    <div>
                                        <label className="text-xs font-bold text-indigo-600 block mb-1">🔑 Sandi Admin Baru</label>
                                        <input required type="text" value={editProfileData.password} onChange={(e) => setEditProfileData({...editProfileData, password: e.target.value})} className="w-full border-none p-3 rounded-xl bg-indigo-50 outline-none text-sm font-bold" />
                                        <p className="text-[10px] text-slate-400 mt-1">Sandi ini digunakan untuk menghidupkan Mode Admin.</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-xs font-bold text-slate-500 block mb-1">Nama Kepala Desa</label><input type="text" value={editProfileData.kepalaDesa} onChange={(e) => setEditProfileData({...editProfileData, kepalaDesa: e.target.value})} className="w-full border p-3 rounded-xl bg-slate-50 outline-none text-sm" /></div>
                                        <div><label className="text-xs font-bold text-slate-500 block mb-1">Nama Ketua TPS3R</label><input type="text" value={editProfileData.ketua} onChange={(e) => setEditProfileData({...editProfileData, ketua: e.target.value})} className="w-full border p-3 rounded-xl bg-slate-50 outline-none text-sm" /></div>
                                    </div>
                                    <div><label className="text-xs font-bold text-slate-500 block mb-1">Deskripsi TPS3R</label><textarea required value={editProfileData.tentang} onChange={(e) => setEditProfileData({...editProfileData, tentang: e.target.value})} className="w-full border p-3 rounded-xl bg-slate-50 outline-none text-sm h-24 resize-none" /></div>
                                    <div><label className="text-xs font-bold text-slate-500 block mb-1">Daftar Anggota</label><textarea value={editProfileData.anggota} onChange={(e) => setEditProfileData({...editProfileData, anggota: e.target.value})} className="w-full border p-3 rounded-xl bg-slate-50 outline-none text-sm h-28 resize-none" placeholder="1. Anggota Satu&#10;2. Anggota Dua" /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-xs font-bold text-slate-500 block mb-1">No. HP / Kontak (WA Ketua)</label><input type="text" value={editProfileData.kontak} onChange={(e) => setEditProfileData({...editProfileData, kontak: e.target.value})} className="w-full border p-3 rounded-xl bg-slate-50 outline-none text-sm" /></div>
                                        <div><label className="text-xs font-bold text-slate-500 block mb-1">Alamat Kantor</label><input type="text" value={editProfileData.alamatDesa} onChange={(e) => setEditProfileData({...editProfileData, alamatDesa: e.target.value})} className="w-full border p-3 rounded-xl bg-slate-50 outline-none text-sm" /></div>
                                    </div>
                                    <div className="pt-4 flex gap-3 sticky bottom-0 bg-white pb-2">
                                        <button type="button" onClick={() => setShowProfileEdit(false)} className="flex-1 bg-slate-100 text-slate-600 py-3.5 rounded-xl font-bold hover:bg-slate-200">Batal</button>
                                        <button type="submit" className="flex-1 gradient-bg text-white py-3.5 rounded-xl font-bold shadow-lg">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: TAMBAH/EDIT WARGA */}
                    {showAddModal && isAdmin && (
                        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setShowAddModal(false)}>
                            <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl animate-fade-in-up" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-bold text-slate-800 mb-6 border-b pb-3">{isEditing ? 'Edit Data Warga' : 'Tambah Warga Baru'}</h3>
                                <form onSubmit={handleSaveCustomer} className="space-y-4">
                                    <div><label className="text-xs font-bold text-slate-500 block mb-1">Nama Lengkap</label><input required type="text" value={newCustomer.name} onChange={(e) => setNewCustomer({...newCustomer, name: e.target.value})} className="w-full border-none p-3 rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none text-sm" /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-xs font-bold text-slate-500 block mb-1">Kategori</label><select value={newCustomer.type} onChange={handleTypeChange} className="w-full border-none p-3 rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">{CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}</select></div>
                                        <div><label className="text-xs font-bold text-slate-500 block mb-1">No. HP (Opsional)</label><input type="tel" value={newCustomer.phone} onChange={(e) => setNewCustomer({...newCustomer, phone: e.target.value})} className="w-full border-none p-3 rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none text-sm" /></div>
                                    </div>
                                    <div><label className="text-xs font-bold text-slate-500 block mb-1">Alamat</label><textarea required value={newCustomer.address} onChange={(e) => setNewCustomer({...newCustomer, address: e.target.value})} className="w-full border-none p-3 rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none text-sm h-20 resize-none" /></div>
                                    <div className="pt-2 flex gap-3"><button type="button" onClick={() => setShowAddModal(false)} className="flex-1 bg-slate-100 text-slate-600 py-3.5 rounded-xl font-bold hover:bg-slate-200">Batal</button><button type="submit" className="flex-1 gradient-bg text-white py-3.5 rounded-xl font-bold shadow-lg">Simpan</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: TARIK DANA / PENGELUARAN (HANYA ADMIN) */}
                    {showExpenseModal && isAdmin && (
                        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setShowExpenseModal(false)}>
                            <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl animate-fade-in-up" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-bold text-slate-800 mb-1 flex items-center gap-2"><Icons.Wallet /> Tarik Dana Kas</h3>
                                <p className="text-xs text-slate-500 mb-6 border-b pb-3">Saldo Maksimal yang dapat ditarik: <b>{formatRupiah(currentBalance)}</b></p>
                                <form onSubmit={handleSaveExpense} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 block mb-1">Jumlah Tarik (Rp)</label>
                                        <input required type="number" min="1" max={currentBalance} value={newExpense.amount} onChange={(e) => setNewExpense({...newExpense, amount: e.target.value})} className="w-full border-none p-3 rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-bold text-indigo-700" placeholder="Contoh: 100000" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 block mb-1">Keterangan / Digunakan Untuk Apa?</label>
                                        <textarea required value={newExpense.reason} onChange={(e) => setNewExpense({...newExpense, reason: e.target.value})} className="w-full border-none p-3 rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none text-sm h-24 resize-none" placeholder="Contoh: Pembelian sapu, Perbaikan gerobak, Setor kas desa, atau Reset Dana." />
                                    </div>
                                    <div className="pt-2 flex gap-3">
                                        <button type="button" onClick={() => setShowExpenseModal(false)} className="flex-1 bg-slate-100 text-slate-600 py-3.5 rounded-xl font-bold hover:bg-slate-200">Batal</button>
                                        <button type="submit" className="flex-1 bg-red-500 text-white hover:bg-red-600 py-3.5 rounded-xl font-bold shadow-lg">Tarik Dana</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* HIDDEN THERMAL RECEIPT */}
                    {receiptData && (
                        <div style={{ position: 'absolute', top: '-10000px', left: '-10000px' }}>
                            <div ref={receiptRef} style={{ width: '380px', padding: '24px', backgroundColor: '#ffffff', color: '#000000', fontFamily: "'Courier New', Courier, monospace", fontSize: '14px', lineHeight: '1.5' }}>
                                <div style={{ textAlign: 'center', fontWeight: 'bold', fontSize: '18px', marginBottom: '4px' }}>TPS3R BANGKIT BERSIH</div>
                                <div style={{ textAlign: 'center', fontSize: '12px', marginBottom: '16px' }}>Desa Karang Bajo</div>
                                <div style={{ borderBottom: '2px dashed #000', marginBottom: '16px' }}></div>
                                <div style={{ textAlign: 'center', fontWeight: 'bold', marginBottom: '16px' }}>BUKTI PEMBAYARAN IURAN</div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}><span>Tanggal:</span><span>{formatIndoDateTime(receiptData.paymentDate || Date.now())}</span></div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}><span>ID TRX:</span><span>TRX-{receiptData.id}</span></div>
                                <div style={{ borderBottom: '1px dashed #000', margin: '12px 0' }}></div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}><span>Nama:</span><span style={{ fontWeight: 'bold' }}>{receiptData.name}</span></div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}><span>Kategori:</span><span>{getCategoryLabel(receiptData.type)}</span></div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}><span>Status:</span><span style={{ fontWeight: 'bold' }}>LUNAS</span></div>
                                <div style={{ borderBottom: '1px dashed #000', margin: '12px 0' }}></div>
                                <div style={{ textAlign: 'center', fontWeight: 'bold', fontSize: '24px', margin: '16px 0' }}>{formatRupiah(receiptData.rate)}</div>
                                <div style={{ borderBottom: '2px dashed #000', marginBottom: '16px' }}></div>
                                <div style={{ textAlign: 'center', fontSize: '12px', marginTop: '16px' }}>Terima Kasih<br />Simpan struk ini sebagai bukti pembayaran.</div>
                            </div>
                        </div>
                    )}

                    {/* TAMPILAN STRUK DI LAYAR */}
                    {receiptData && (
                        <div className="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setReceiptData(null)}>
                            <div className="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl animate-fade-in-up" onClick={e => e.stopPropagation()}>
                                <div className="bg-emerald-500 p-6 text-center relative overflow-hidden">
                                    <div className="bg-white w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3 text-emerald-500 text-2xl font-bold shadow-md relative z-10">✓</div>
                                    <h3 className="text-white font-bold text-lg relative z-10">Pembayaran Berhasil</h3>
                                    <p className="text-emerald-50 text-xs mt-1 relative z-10">{formatIndoDateTime(receiptData.paymentDate || Date.now())}</p>
                                </div>
                                <div className="p-6">
                                    <div className="text-center mb-6">
                                        <p className="text-xs text-slate-400 font-bold uppercase tracking-widest">Total Bayar</p>
                                        <h2 className="text-3xl font-black text-slate-800 mt-1">{formatRupiah(receiptData.rate)}</h2>
                                    </div>
                                    <div className="space-y-3 text-sm border-t border-dashed border-slate-200 pt-5">
                                        <div className="flex justify-between"><span className="text-slate-500">Nama Warga</span><span className="font-bold text-slate-800">{receiptData.name}</span></div>
                                        <div className="flex justify-between"><span className="text-slate-500">Kategori</span><span className="font-bold text-slate-800">{getCategoryLabel(receiptData.type)}</span></div>
                                    </div>
                                </div>
                                <div className="px-6 pb-6 bg-slate-50 border-t border-slate-100 flex flex-col gap-3 pt-4">
                                    <button onClick={downloadReceiptAsImage} className="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold text-sm hover:bg-indigo-700 transition shadow-md flex justify-center items-center gap-2">
                                        <Icons.Image /> Download Struk (Thermal)
                                    </button>
                                    <button onClick={() => setReceiptData(null)} className="w-full bg-white border border-slate-200 text-slate-600 py-3 rounded-xl font-bold text-sm hover:bg-slate-100 transition">Tutup</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
